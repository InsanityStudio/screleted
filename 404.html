<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // The project site is hosted at /screleted/ on insanitystudio.github.io.
    // screleted.github.io and Cloudflare Pages are root-hosted sites.
    var l = window.location;
    var isProjectSite = l.hostname === 'insanitystudio.github.io';
    var segmentsToKeep = isProjectSite ? 1 : 0;
    var parts = l.pathname.split('/').filter(Boolean);
    var rest = parts.slice(segmentsToKeep);
    var name = rest[0] || '';
    var section = rest[1] || '';
    var base = isProjectSite ? '/screleted/' : '/';
    var qs = [];

    if (/^\d+$/.test(name)) {
      qs.push('studio=' + encodeURIComponent(name));
    } else if (name) {
      qs.push('user=' + encodeURIComponent(decodeURIComponent(name)));
      if (section) qs.push('section=' + encodeURIComponent(decodeURIComponent(section)));
    }

    l.replace(l.protocol + '//' + l.host + base + (qs.length ? '?' + qs.join('&') : '') + l.hash);
  </script>
</head>
<body>Redirecting…</body>
</html>
