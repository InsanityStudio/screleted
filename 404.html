<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // GitHub project site is rooted at /screleted/; screleted.github.io and
    // screleted.pages.dev are rooted at /.
    const locationInfo = window.location;
    const isProjectSite = locationInfo.hostname === 'insanitystudio.github.io';
    const segmentsToKeep = isProjectSite ? 1 : 0;
    const parts = locationInfo.pathname.split('/').filter(Boolean);
    const route = parts.slice(segmentsToKeep);
    const base = isProjectSite ? '/screleted/' : '/';
    const decode = value => {
      try { return decodeURIComponent(value || ''); }
      catch (error) { return value || ''; }
    };
    const query = [];

    if (route[0] === 'studios' && /^\d+$/.test(route[1] || '')) {
      query.push('studio=' + encodeURIComponent(route[1]));
    } else if (route[0] === 'users' && route[1]) {
      query.push('user=' + encodeURIComponent(decode(route[1])));
      if (route[2]) query.push('section=' + encodeURIComponent(decode(route[2])));
    }

    locationInfo.replace(locationInfo.protocol + '//' + locationInfo.host + base +
      (query.length ? '?' + query.join('&') : '') + locationInfo.hash);
  </script>
</head>
<body>Redirecting…</body>
</html>
