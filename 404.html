<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <script>
    // /users/NAME[/section] and /studios/ID have no real files on static hosting, so the
    // host serves this page; turn the path into a query string for index.html.
    // The GitHub project site lives under /screleted/; the other hosts are at the root.
    (function () {
      var l = location;
      var project = l.hostname === 'insanitystudio.github.io';
      var base = project ? '/screleted/' : '/';
      var route = l.pathname.split('/').filter(Boolean).slice(project ? 1 : 0);
      var dec = function (v) { try { return decodeURIComponent(v); } catch (e) { return v; } };
      var q = [];
      if (route[0] === 'studios' && /^\d+$/.test(route[1] || '')) {
        q.push('studio=' + encodeURIComponent(route[1]));
      } else if (route[0] === 'users' && route[1]) {
        q.push('user=' + encodeURIComponent(dec(route[1])));
        if (route[2]) q.push('section=' + encodeURIComponent(dec(route[2])));
      }
      l.replace(base + (q.length ? '?' + q.join('&') : '') + l.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>Redirecting…</body>
</html>
