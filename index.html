<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Profile Viewer</title>
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/main.css">
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/pages/profile.css">
  <style>
    #profile-data .loading-img { display: none; }
    .error-message { color: #d9534f; padding: 10px; font-weight: bold; }
    #topnav .logo {
        background: none;
        width: 100px;
        height: 40px;
        display: inline-block;
        margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="pagewrapper">
    <div id="topnav">
      <div class="innerwrap">
        <div class="container">
          <a href="https://scratch.mit.edu/" class="logo">
            <img src="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/images/logo.png" alt="Scratch Logo" style="height: 30px; margin-top: 10px;">
          </a>
          <ul class="site-nav">
            <li><a href="https://scratch.mit.edu/projects/editor/">Create</a></li>
            <li><a href="https://scratch.mit.edu/explore/projects/all">Explore</a></li>
            <li class="last"><a href="https://scratch.mit.edu/ideas">Ideas</a></li>
          </ul>
          <form class="search" id="profile-search-form" style="position: relative;">
            <input type="submit" class="glass" value="" style="cursor: pointer;">
            <input id="search-input" type="text" placeholder="Search username" name="q" value="-ColossAnimations-">
          </form>
          <ul class="account-nav">
            <li class="join-scratch"><a href="https://scratch.mit.edu/join">Join Scratch</a></li>
            <li id="login-dropdown" class="sign-in dropdown">
              <span data-toggle="dropdown" class="dropdown-toggle"><span>Sign in</span></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="container" id="content" style="margin-top: 20px;">
      <div id="alert-view"></div>

      <div class="box" id="profile-data">
        <div class="box-head">
          <form id="profile-avatar" class="portrait">
            <div class="avatar-wrapper">
              <a href="#" id="profile-avatar-link">
                <img id="profile-avatar-img" src="https://cdn2.scratch.mit.edu/get_image/user/143563846_60x60.png" width="55" height="55">
              </a>
            </div>
          </form>
          <div class="header-text">
            <h2 id="profile-username">Loading...</h2>
            <p class="profile-details">
              <span class="group">Scratcher</span>
              Joined <span id="profile-join-date" title="">Unknown</span>
              <span class="location" id="profile-country"></span>
            </p>
          </div>
        </div>
        <div class="box-content" id="profile-box">
          <div class="action-bar"></div>
          <div class="inner clearfix">
            <div class="user-content">
              <div id="user-details" class="about">
                <h3>About me</h3>
                <div id="bio-readonly" class="read-only">
                  <div class="viewport" style="overflow: auto; max-height: 150px;">
                    <p class="overview" id="profile-bio">Loading bio...</p>
                  </div>
                </div>
                <h3>What I'm working on</h3>
                <div id="status-readonly" class="read-only">
                  <div class="viewport" style="overflow: auto; max-height: 100px;">
                    <p class="overview" id="profile-status"></p>
                  </div>
                </div>
              </div>
              <div class="player">
                <h3 class="featured-project-heading">Featured Project</h3>
                <div class="stage" style="width: 282px;">
                  <a href="#" id="featured-project-link">
                    <img id="featured-project-img" src="https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png" width="282" height="210" alt="Featured project" style="background: #f2f2f2; object-fit: cover;">
                  </a>
                </div>
                <span class="title">
                  <a class="project-name" id="featured-project-title" href="#">Loading...</a>
                </span>
              </div>
            </div>
            <div class="doing">
              <h3>What I've been doing</h3>
              <div id="activity-feed">
                <ul class="activity-stream"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="box slider-carousel-container prevent-select" style="margin-top: 20px;">
        <div class="box-head">
          <h4>Shared Projects (<span id="shared-count">0</span>)</h4>
          <a href="#" data-control="view-all">View all</a>
        </div>
        <div class="box-content" id="shared" style="min-height: 154.5px;">
          <div class="viewport" style="overflow: hidden;">
            <ul class="scroll-content" id="shared-projects-list" style="display: flex; flex-wrap: wrap; gap: 10px; padding: 10px;"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SCRATCH_API_BASE = 'https://api.scratch.mit.edu';

      // Paste your Cloudflare Worker URL here (no trailing slash), e.g.
      // 'https://scratch-proxy.YOURNAME.workers.dev'
      const WORKER_URL = 'https://scratch-proxy.a225tunc.workers.dev/';

      // Fallback chain: if one free proxy is down (e.g. AllOrigins' 522 outage),
      // we automatically try the next one. All are third-party services with
      // rate limits, so this is a demo-grade solution, not production-grade.
      const CORS_PROXIES = [
        // AllOrigins /get: wraps the response so we can read the REAL status code
        u => ({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, unwrap: 'allorigins' }),
        // ThingProxy: plain pass-through (100KB / 10 req/s limits)
        u => ({ url: `https://thingproxy.freeboard.io/fetch/${u}`, unwrap: 'raw' }),
        // cors.lol: plain pass-through
        u => ({ url: `https://api.cors.lol/?url=${encodeURIComponent(u)}`, unwrap: 'raw' }),
        // CodeTabs: plain pass-through (occasionally returns 400s)
        u => ({ url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, unwrap: 'raw' }),
      ];

      // Don't let a dead proxy hang the page for 20s like the 522 did
      async function fetchWithTimeout(url, ms = 10000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          return await fetch(url, { signal: ctrl.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      async function fetchScratchAPI(endpoint) {
        const target = SCRATCH_API_BASE + endpoint;
        const failures = [];

        // 1) Your own Worker proxy (reliable), 2) direct, 3) public proxies.
        try {
          const res = await fetchWithTimeout(WORKER_URL ? WORKER_URL + endpoint : target);
          if (res.status === 404) { const e = new Error('HTTP 404'); e.notFound = true; throw e; }
          if (res.ok) return { data: await res.json(), httpCode: res.status };
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + res.status);
        } catch (err) {
          if (err.notFound) throw err;
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + (err.message || 'network error'));
        }

        for (const makeProxy of CORS_PROXIES) {
          const { url, unwrap } = makeProxy(target);
          try {
            const res = await fetchWithTimeout(url);

            if (!res.ok) {
              if (res.status === 404) {
                const e = new Error('HTTP 404'); e.notFound = true; throw e;
              }
              failures.push(`${new URL(url).hostname}: ${res.status}`);
              continue; // this proxy is down/rate-limited -> try the next one
            }

            const text = await res.text();
            let httpCode = null;
            let payload = text;

            if (unwrap === 'allorigins') {
              // If AllOrigins' server is down, Cloudflare returns an HTML error
              // page (and no CORS headers, which is why fetch() used to reject
              // with "Failed to fetch"). JSON.parse below will throw and we
              // fall through to the next proxy instead.
              const wrapper = JSON.parse(text);
              httpCode = wrapper.status && wrapper.status.http_code;
              payload = wrapper.contents;
              if (httpCode === 404) { const e = new Error('HTTP 404'); e.notFound = true; throw e; }
              if (httpCode && httpCode >= 400) { failures.push(`allorigins: ${httpCode}`); continue; }
            }

            return { data: JSON.parse(payload), httpCode };
          } catch (err) {
            if (err.notFound) throw err; // a real 404 — don't try other proxies
            failures.push(`${new URL(url).hostname}: ${err.message || 'network error'}`);
          }
        }

        const e = new Error('All CORS proxies are down right now (' + failures.join('; ') + '). Wait a minute and search again.');
        e.proxyOutage = true;
        throw e;
      }

      function formatJoinDate(joinedIso) {
        if (!joinedIso) return 'Unknown';
        const joined = new Date(joinedIso);
        const now = new Date();
        let years = now.getFullYear() - joined.getFullYear();
        let months = now.getMonth() - joined.getMonth();
        if (months < 0) { years--; months += 12; }
        const parts = [];
        if (years > 0) parts.push(years + ' year' + (years > 1 ? 's' : ''));
        if (months > 0) parts.push(months + ' month' + (months > 1 ? 's' : ''));
        return parts.length ? parts.join(', ') + ' ago' : 'just now';
      }

      function createProjectItem(project) {
        const li = document.createElement('li');
        li.className = 'project thumb item';
        li.style.width = '144px';
        li.style.margin = '0';
        const imgSrc = project.image || 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_144x108.png';
        li.innerHTML = `
          <a href="https://scratch.mit.edu/projects/${project.id}/" target="_blank">
            <img class="lazy image" src="${imgSrc}" width="144" height="108" style="display: block; object-fit: cover;">
          </a>
          <span class="title" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 5px 0;">
            <a href="https://scratch.mit.edu/projects/${project.id}/" target="_blank" style="font-weight: bold; color: #575e75;">${project.title}</a>
          </span>
        `;
        return li;
      }

      async function loadProfile(username) {
        if (!username) return;

        const alertBox = document.getElementById('alert-view');
        alertBox.innerHTML = '<div style="padding: 10px; background: #e3f2fd; margin-bottom: 10px;">Loading profile for <strong>' + username + '</strong>...</div>';

        try {
          const { data: user } = await fetchScratchAPI('/users/' + encodeURIComponent(username));
          // Shape check: proxies sometimes mask a 404 as a 200 with junk body
          if (!user || typeof user !== 'object' || !user.username) {
            throw new Error(`User “${username}” not found`);
          }

          alertBox.innerHTML = '';

          document.getElementById('profile-username').textContent = user.username;

          if (user.profile && user.profile.images && user.profile.images['60x60']) {
              document.getElementById('profile-avatar-img').src = user.profile.images['60x60'];
          }
          // (avatar falls back to the default image in the HTML if missing)
          document.getElementById('profile-avatar-link').href = `https://scratch.mit.edu/users/${user.username}/`;

          const joinedIso = user.history && user.history.joined;
          document.getElementById('profile-join-date').textContent = formatJoinDate(joinedIso);
          document.getElementById('profile-join-date').title = joinedIso ? joinedIso.split('T')[0] : '';

          const prof = user.profile || {};
          document.getElementById('profile-country').textContent = prof.country || '';

          document.getElementById('profile-bio').innerHTML = prof.bio || '<em>No bio provided.</em>';
          document.getElementById('profile-status').innerHTML = prof.status || '<em>No status provided.</em>';

          const { data: rawProjects } = await fetchScratchAPI('/users/' + encodeURIComponent(username) + '/projects?limit=20');
          const projects = Array.isArray(rawProjects) ? rawProjects : [];

          if (projects.length > 0) {
            const featured = projects[0];
            document.getElementById('featured-project-img').src = featured.image;
            document.getElementById('featured-project-title').textContent = featured.title;
            document.getElementById('featured-project-title').href = `https://scratch.mit.edu/projects/${featured.id}/`;
            document.getElementById('featured-project-link').href = `https://scratch.mit.edu/projects/${featured.id}/`;
          } else {
            document.getElementById('featured-project-img').src = 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png';
            document.getElementById('featured-project-title').textContent = 'No projects yet';
            document.getElementById('featured-project-title').href = '#';
            document.getElementById('featured-project-link').href = '#';
          }

          const sharedList = document.getElementById('shared-projects-list');
          sharedList.innerHTML = '';
          projects.forEach(p => sharedList.appendChild(createProjectItem(p)));
          document.getElementById('shared-count').textContent = projects.length;

        } catch (err) {
          const msg = err.notFound ? `Error: User “${username}” not found` : `Error: ${err.message}`;
          alertBox.innerHTML = `<div class="error-message">${msg}</div>`;
          console.error('Profile load error:', err);
        }
      }

      const searchForm = document.getElementById('profile-search-form');
      searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('search-input').value.trim();
        if (username) loadProfile(username);
      });

      window.addEventListener('load', () => {
        const defaultUser = document.getElementById('search-input').value.trim();
        if (defaultUser) loadProfile(defaultUser);
      });
    })();
  </script>
</body>
</html>
