<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Profile Viewer</title>
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/main.css">
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/pages/profile.css">
  <style>
    #profile-data .loading-img { display: none; }
    .error-message { color: #d9534f; padding: 10px; font-weight: bold; }
    #topnav .logo { background: none; width: 100px; height: 40px; display: inline-block; margin-top: 5px; }
    #profile-bio, #profile-status { white-space: pre-wrap; word-wrap: break-word; }

    .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px; margin: 0; list-style: none; }
    .grid .msg { color: #888; font-style: italic; padding: 10px 0; }
    .card { width: 144px; text-align: left; }
    .card.user { width: 96px; text-align: center; }
    .card img { display: block; background: #f2f2f2; object-fit: cover; }
    .card.user img { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto; }
    .card:not(.user) img { width: 144px; height: 108px; }
    .card a { color: #575e75; font-weight: bold; text-decoration: none; }
    .card .name { display: block; padding: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .pager { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 14px; }
    .pager button { background: #4d97ff; color: #fff; border: 0; border-radius: 4px; padding: 8px 16px; font-weight: bold; cursor: pointer; }
    .pager button:disabled { background: #c9d4e8; cursor: default; }
    #full-back { cursor: pointer; }
  </style>
</head>
<body>
  <div id="pagewrapper">
    <div id="topnav">
      <div class="innerwrap">
        <div class="container">
          <a href="https://scratch.mit.edu/" class="logo">
            <img src="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/images/logo.png" alt="Scratch Logo" style="height: 30px; margin-top: 10px;">
          </a>
          <ul class="site-nav">
            <li><a href="https://scratch.mit.edu/projects/editor/">Create</a></li>
            <li><a href="https://scratch.mit.edu/explore/projects/all">Explore</a></li>
            <li class="last"><a href="https://scratch.mit.edu/ideas">Ideas</a></li>
          </ul>
          <form class="search" id="profile-search-form" style="position: relative;">
            <input type="submit" class="glass" value="" style="cursor: pointer;">
            <input id="search-input" type="text" placeholder="Search username" name="q" value="-ColossAnimations-">
          </form>
          <ul class="account-nav">
            <li class="join-scratch"><a href="https://scratch.mit.edu/join">Join Scratch</a></li>
            <li id="login-dropdown" class="sign-in dropdown">
              <span data-toggle="dropdown" class="dropdown-toggle"><span>Sign in</span></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="container" id="content" style="margin-top: 20px;">
      <div id="alert-view"></div>

      <!-- Full "View all" page for one section -->
      <div id="full-view" style="display: none;">
        <div class="box">
          <div class="box-head">
            <h4 id="full-title"></h4>
            <a id="full-back">&larr; Back to profile</a>
          </div>
          <div class="box-content">
            <ul class="grid" id="full-grid"></ul>
            <div class="pager">
              <button id="pager-prev">&larr; Previous</button>
              <span id="pager-label">Page 1</span>
              <button id="pager-next">Next &rarr;</button>
            </div>
          </div>
        </div>
      </div>

      <div id="profile-view">
        <div class="box" id="profile-data">
          <div class="box-head">
            <form id="profile-avatar" class="portrait">
              <div class="avatar-wrapper">
                <a href="#" id="profile-avatar-link">
                  <img id="profile-avatar-img" src="https://cdn2.scratch.mit.edu/get_image/user/143563846_60x60.png" width="55" height="55">
                </a>
              </div>
            </form>
            <div class="header-text">
              <h2 id="profile-username">Loading...</h2>
              <p class="profile-details">
                <span class="group">Scratcher</span>
                Joined <span id="profile-join-date" title="">Unknown</span>
                <span class="location" id="profile-country"></span>
              </p>
            </div>
          </div>
          <div class="box-content" id="profile-box">
            <div class="action-bar"></div>
            <div class="inner clearfix">
              <div class="user-content">
                <div id="user-details" class="about">
                  <h3>About me</h3>
                  <div id="bio-readonly" class="read-only">
                    <div class="viewport" style="overflow: auto; max-height: 150px;">
                      <p class="overview" id="profile-bio">Loading bio...</p>
                    </div>
                  </div>
                  <h3>What I'm working on</h3>
                  <div id="status-readonly" class="read-only">
                    <div class="viewport" style="overflow: auto; max-height: 100px;">
                      <p class="overview" id="profile-status"></p>
                    </div>
                  </div>
                </div>
                <div class="player">
                  <h3 class="featured-project-heading">Featured Project</h3>
                  <div class="stage" style="width: 282px;">
                    <a href="#" id="featured-project-link">
                      <img id="featured-project-img" src="https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png" width="282" height="210" alt="Featured project" style="background: #f2f2f2; object-fit: cover;">
                    </a>
                  </div>
                  <span class="title">
                    <a class="project-name" id="featured-project-title" href="#">Loading...</a>
                  </span>
                </div>
              </div>
              <div class="doing">
                <h3>What I've been doing</h3>
                <div id="activity-feed">
                  <ul class="activity-stream"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section previews (projects, favorites, studios, following, followers) are built here -->
        <div id="sections"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SCRATCH_API_BASE = 'https://api.scratch.mit.edu';

      // Paste your Cloudflare Worker URL here (no trailing slash), e.g.
      // 'https://scratch-proxy.YOURNAME.workers.dev'
      const WORKER_URL = '';

      const PREVIEW_LIMIT = 12;   // items shown on the profile page
      const PAGE_SIZE = 40;       // items per page in "View all" (API max is 40)

      const DEFAULT_AVATAR = 'https://cdn2.scratch.mit.edu/get_image/user/default_60x60.png';
      const DEFAULT_PROJECT = 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_144x108.png';

      // Sections shown on the profile, in order.
      const SECTIONS = {
        projects:  { title: 'Shared Projects',  path: 'projects',       kind: 'project' },
        favorites: { title: 'Favorites',        path: 'favorites',      kind: 'project' },
        studios:   { title: 'Studios I Curate', path: 'studios/curate', kind: 'studio'  },
        following: { title: 'Following',        path: 'following',      kind: 'user'    },
        followers: { title: 'Followers',        path: 'followers',      kind: 'user'    },
      };

      // Fallback chain used only if the Worker/direct request fails.
      const CORS_PROXIES = [
        u => ({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, unwrap: 'allorigins' }),
        u => ({ url: `https://thingproxy.freeboard.io/fetch/${u}`, unwrap: 'raw' }),
        u => ({ url: `https://api.cors.lol/?url=${encodeURIComponent(u)}`, unwrap: 'raw' }),
        u => ({ url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, unwrap: 'raw' }),
      ];

      let currentUser = null;   // username currently displayed
      let loadToken = 0;        // ignore results from outdated loads
      let full = { key: null, page: 1 };

      const $ = id => document.getElementById(id);

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function fetchWithTimeout(url, ms = 10000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try { return await fetch(url, { signal: ctrl.signal }); }
        finally { clearTimeout(timer); }
      }

      function notFoundError() { const e = new Error('HTTP 404'); e.notFound = true; return e; }

      async function fetchScratchAPI(endpoint) {
        const target = SCRATCH_API_BASE + endpoint;
        const failures = [];

        // 1) Your own Worker (if set), otherwise a direct request
        try {
          const res = await fetchWithTimeout(WORKER_URL ? WORKER_URL + endpoint : target);
          if (res.status === 404) throw notFoundError();
          if (res.ok) return { data: await res.json() };
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + res.status);
        } catch (err) {
          if (err.notFound) throw err;
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + (err.message || 'network error'));
        }

        // 2) Public proxies as a last resort
        for (const makeProxy of CORS_PROXIES) {
          const { url, unwrap } = makeProxy(target);
          try {
            const res = await fetchWithTimeout(url);
            if (!res.ok) {
              if (res.status === 404) throw notFoundError();
              failures.push(`${new URL(url).hostname}: ${res.status}`);
              continue;
            }
            const text = await res.text();
            let payload = text;
            if (unwrap === 'allorigins') {
              const wrapper = JSON.parse(text);
              const code = wrapper.status && wrapper.status.http_code;
              payload = wrapper.contents;
              if (code === 404) throw notFoundError();
              if (code && code >= 400) { failures.push(`allorigins: ${code}`); continue; }
            }
            return { data: JSON.parse(payload) };
          } catch (err) {
            if (err.notFound) throw err;
            failures.push(`${new URL(url).hostname}: ${err.message || 'network error'}`);
          }
        }

        const e = new Error('Could not reach the Scratch API (' + failures.join('; ') + ').');
        e.proxyOutage = true;
        throw e;
      }

      function formatJoinDate(joinedIso) {
        if (!joinedIso) return 'Unknown';
        const joined = new Date(joinedIso);
        const now = new Date();
        let years = now.getFullYear() - joined.getFullYear();
        let months = now.getMonth() - joined.getMonth();
        if (months < 0) { years--; months += 12; }
        const parts = [];
        if (years > 0) parts.push(years + ' year' + (years > 1 ? 's' : ''));
        if (months > 0) parts.push(months + ' month' + (months > 1 ? 's' : ''));
        return parts.length ? parts.join(', ') + ' ago' : 'just now';
      }

      // ---------- Card rendering ----------
      function createCard(kind, item) {
        const li = document.createElement('li');
        if (kind === 'user') {
          const imgs = (item.profile && item.profile.images) || {};
          const src = imgs['90x90'] || imgs['60x60'] || DEFAULT_AVATAR;
          li.className = 'card user';
          li.innerHTML = `
            <a href="#" data-user="${esc(item.username)}" title="View ${esc(item.username)} in this viewer">
              <img src="${esc(src)}" alt="">
              <span class="name">${esc(item.username)}</span>
            </a>`;
        } else if (kind === 'studio') {
          const url = `https://scratch.mit.edu/studios/${item.id}/`;
          li.className = 'card';
          li.innerHTML = `
            <a href="${url}" target="_blank" rel="noopener"><img src="${esc(item.image || DEFAULT_PROJECT)}" alt=""></a>
            <a class="name" href="${url}" target="_blank" rel="noopener">${esc(item.title)}</a>`;
        } else {
          const url = `https://scratch.mit.edu/projects/${item.id}/`;
          li.className = 'card';
          li.innerHTML = `
            <a href="${url}" target="_blank" rel="noopener"><img src="${esc(item.image || DEFAULT_PROJECT)}" alt=""></a>
            <a class="name" href="${url}" target="_blank" rel="noopener">${esc(item.title)}</a>`;
        }
        return li;
      }

      function fillGrid(ul, kind, items, emptyMsg) {
        ul.innerHTML = '';
        if (!items.length) {
          const li = document.createElement('li');
          li.className = 'msg';
          li.textContent = emptyMsg || 'Nothing here.';
          ul.appendChild(li);
          return;
        }
        items.forEach(it => ul.appendChild(createCard(kind, it)));
      }

      function errorText(err) {
        return err.notFound ? 'Not available for this account.' : 'Could not load: ' + err.message;
      }

      function sectionEndpoint(username, key, limit, offset) {
        return '/users/' + encodeURIComponent(username) + '/' + SECTIONS[key].path +
               '?limit=' + limit + '&offset=' + offset;
      }

      // ---------- Profile page sections ----------
      function buildSectionBoxes() {
        const wrap = $('sections');
        wrap.innerHTML = '';
        Object.keys(SECTIONS).forEach(key => {
          const box = document.createElement('div');
          box.className = 'box slider-carousel-container prevent-select';
          box.style.marginTop = '20px';
          box.id = 'section-' + key;
          box.innerHTML = `
            <div class="box-head">
              <h4>${esc(SECTIONS[key].title)} (<span class="count">…</span>)</h4>
              <a href="#" data-view-all="${key}">View all</a>
            </div>
            <div class="box-content" style="min-height: 60px;">
              <ul class="grid"><li class="msg">Loading…</li></ul>
            </div>`;
          wrap.appendChild(box);
        });
      }

      async function loadSectionPreview(username, key, token) {
        const box = $('section-' + key);
        const ul = box.querySelector('.grid');
        const countEl = box.querySelector('.count');
        try {
          const { data } = await fetchScratchAPI(sectionEndpoint(username, key, PREVIEW_LIMIT, 0));
          if (token !== loadToken) return null;
          const items = Array.isArray(data) ? data : [];
          fillGrid(ul, SECTIONS[key].kind, items);
          countEl.textContent = items.length >= PREVIEW_LIMIT ? PREVIEW_LIMIT + '+' : items.length;
          return items;
        } catch (err) {
          if (token !== loadToken) return null;
          ul.innerHTML = '';
          const li = document.createElement('li');
          li.className = 'msg';
          li.textContent = errorText(err);
          ul.appendChild(li);
          countEl.textContent = '?';
          return null;
        }
      }

      function setFeatured(project) {
        const img = $('featured-project-img');
        const title = $('featured-project-title');
        const link = $('featured-project-link');
        if (project) {
          img.src = project.image || DEFAULT_PROJECT;
          title.textContent = project.title;
          title.href = link.href = `https://scratch.mit.edu/projects/${project.id}/`;
        } else {
          img.src = 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png';
          title.textContent = 'No projects yet';
          title.href = link.href = '#';
        }
      }

      async function loadProfile(username) {
        if (!username) return;
        const token = ++loadToken;
        hideFull();

        const alertBox = $('alert-view');
        alertBox.innerHTML = '<div style="padding: 10px; background: #e3f2fd; margin-bottom: 10px;">Loading profile for <strong>' + esc(username) + '</strong>...</div>';

        try {
          const { data: user } = await fetchScratchAPI('/users/' + encodeURIComponent(username));
          if (token !== loadToken) return;
          if (!user || typeof user !== 'object' || !user.username) {
            throw new Error(`User “${username}” not found`);
          }

          alertBox.innerHTML = '';
          currentUser = user.username;
          $('search-input').value = user.username;

          $('profile-username').textContent = user.username;
          const profile = user.profile || {};

          $('profile-avatar-img').src =
            (profile.images && (profile.images['60x60'] || profile.images['90x90'])) || DEFAULT_AVATAR;
          $('profile-avatar-link').href = `https://scratch.mit.edu/users/${encodeURIComponent(user.username)}/`;

          const joinedIso = user.history && user.history.joined;
          $('profile-join-date').textContent = formatJoinDate(joinedIso);
          $('profile-join-date').title = joinedIso ? joinedIso.split('T')[0] : '';
          $('profile-country').textContent = profile.country || '';

          // bio/status are plain text on Scratch: use textContent (no HTML injection)
          $('profile-bio').textContent = profile.bio || 'No bio provided.';
          $('profile-status').textContent = profile.status || 'No status provided.';

          setFeatured(null);
          $('featured-project-title').textContent = 'Loading...';
          buildSectionBoxes();

          const results = await Promise.all(
            Object.keys(SECTIONS).map(k => loadSectionPreview(user.username, k, token)));
          if (token !== loadToken) return;
          const projects = results[0];
          setFeatured(projects && projects.length ? projects[0] : null);

        } catch (err) {
          if (token !== loadToken) return;
          const msg = err.notFound ? `Error: User “${esc(username)}” not found` : `Error: ${esc(err.message)}`;
          alertBox.innerHTML = `<div class="error-message">${msg}</div>`;
          console.error('Profile load error:', err);
        }
      }

      // ---------- "View all" pages ----------
      function hideFull() {
        $('full-view').style.display = 'none';
        $('profile-view').style.display = '';
        full = { key: null, page: 1 };
      }

      async function showFull(key, page) {
        if (!currentUser) return;
        full = { key, page };
        const sec = SECTIONS[key];
        $('profile-view').style.display = 'none';
        $('full-view').style.display = '';
        $('full-title').textContent = `${currentUser} — ${sec.title}`;
        $('pager-label').textContent = 'Page ' + page;
        $('pager-prev').disabled = true;
        $('pager-next').disabled = true;
        const ul = $('full-grid');
        ul.innerHTML = '<li class="msg">Loading…</li>';
        window.scrollTo(0, 0);

        const myKey = key, myPage = page, myUser = currentUser;
        try {
          const { data } = await fetchScratchAPI(sectionEndpoint(myUser, key, PAGE_SIZE, (page - 1) * PAGE_SIZE));
          if (full.key !== myKey || full.page !== myPage || currentUser !== myUser) return;
          const items = Array.isArray(data) ? data : [];
          fillGrid(ul, sec.kind, items, page > 1 ? 'No more results.' : 'Nothing here.');
          $('pager-prev').disabled = page <= 1;
          $('pager-next').disabled = items.length < PAGE_SIZE;
        } catch (err) {
          if (full.key !== myKey || full.page !== myPage) return;
          ul.innerHTML = '';
          const li = document.createElement('li');
          li.className = 'msg';
          li.textContent = errorText(err);
          ul.appendChild(li);
          $('pager-prev').disabled = page <= 1;
        }
      }

      // ---------- Events ----------
      document.addEventListener('click', function(e) {
        const viewAll = e.target.closest('[data-view-all]');
        if (viewAll) { e.preventDefault(); showFull(viewAll.dataset.viewAll, 1); return; }

        const userLink = e.target.closest('[data-user]');
        if (userLink) { e.preventDefault(); loadProfile(userLink.dataset.user); window.scrollTo(0, 0); }
      });
      $('full-back').addEventListener('click', hideFull);
      $('pager-prev').addEventListener('click', () => showFull(full.key, full.page - 1));
      $('pager-next').addEventListener('click', () => showFull(full.key, full.page + 1));

      $('profile-search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = $('search-input').value.trim();
        if (username) loadProfile(username);
      });

      window.addEventListener('load', () => {
        const defaultUser = $('search-input').value.trim();
        if (defaultUser) loadProfile(defaultUser);
      });
    })();
  </script>
</body>
</html>
