<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Profile Viewer</title>
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/main.css">
  <link rel="stylesheet" href="https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/css/pages/profile.css">
  <style>
    #profile-data .loading-img { display: none; }
    .error-message { color: #d9534f; padding: 10px; font-weight: bold; }
    #topnav .logo { background: none; float: left; width: auto; height: 35px; margin: 0 20px 0 0 !important; padding: 0; display: flex; align-items: center; overflow: hidden; }
    #topnav .logo img { height: 24px; width: auto; margin: 0 !important; display: block; }
    #profile-bio, #profile-status { white-space: pre-wrap; word-wrap: break-word; }

    .grid { display: flex; flex-wrap: wrap; gap: 14px 30px; padding: 12px 26px; margin: 0; list-style: none; }
    .grid .msg { color: #888; font-style: italic; padding: 10px 0; }
    .grid .empty { width: 100%; box-sizing: border-box; background: #d9ecf7; border: 1px solid #c5e0f0; border-radius: 6px;
                   text-align: center; font-weight: bold; font-size: 18px; color: #575e75; padding: 32px 20px; }
    /* Profile-page previews: always exactly one row (never wraps) */
    .grid.preview { flex-wrap: nowrap; overflow: hidden; }
    .grid.preview.k-project { gap: 32px; }
    .grid.preview.k-studio  { gap: 40px; }
    .grid.preview.k-user    { gap: 37px; }

    .note { padding: 10px 26px 0; color: #575e75; font-size: 13px; font-style: italic; }
    .card { width: 144px; flex: 0 0 auto; }
    .card img { display: block; background: #f2f2f2; object-fit: cover; }
    .card a { color: #855cd6; text-decoration: none; }
    .card .name { display: block; padding: 6px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  font-size: 14px; font-weight: bold; }
    .card.project .name, .card.project .by { width: 144px; }
    .card .by a { color: #575e75; font-weight: normal; }
    .card .by { display: block; font-size: 12px; color: #575e75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* projects: 144x108 */
    .card.project img { width: 144px; height: 108px; }

    /* studios: 170x100 thumbnail in a thin frame */
    .card.studio { width: 184px; }
    .card.studio .thumb { display: block; position: relative; box-sizing: content-box; width: 170px; border: 1px solid #d9d9d9; padding: 6px; background: #fff; }
    .card.studio .name { max-width: 188px; }
    .card.studio .badge { position: absolute; right: 10px; bottom: 10px; width: 26px; height: 19px; border-radius: 4px;
                          background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
    .card.studio img { width: 170px; height: 100px; }

    /* users: 60x60 square */
    .card.user { width: 60px; }
    .card.user img { width: 60px; height: 60px; }
    .card.user .name { font-size: 13px; }
    .logo-fallback { color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 1px; line-height: 40px; }
    /* ---- Full "View all" pages (modelled on scratch.mit.edu list pages) ---- */
    #full-head { display: flex; align-items: center; gap: 14px; height: auto; padding: 16px 20px; }
    #full-avatar { width: 55px; height: 55px; display: block; background: #f2f2f2; }
    #full-title { margin: 0; font-size: 26px; font-weight: 700; color: #575e75; line-height: 1.2; }
    #full-title a { color: #855cd6; font-weight: 600; text-decoration: none; }
    #full-back { margin-left: auto; color: #855cd6; cursor: pointer; font-size: 14px; }
    .grid.full { gap: 0; padding: 14px 0 6px 20px; }
    .grid.full .card { margin: 0 0 18px; }
    .grid.full.k-user    .card { width: 82.4px; margin-bottom: 22px; }
    .grid.full.k-project .card { width: 182.4px; }
    .grid.full.k-studio  .card { width: 226.4px; }
    .grid.full .by a { color: #855cd6; }
    .paging { padding: 4px 20px 20px; font-size: 15px; color: #575e75; }
    .paging a { color: #855cd6; text-decoration: none; margin: 0 4px; cursor: pointer; }
    .paging a:hover { text-decoration: underline; }
    .paging .cur { color: #222; font-weight: bold; margin: 0 4px; }
    .paging .dis { color: #aaa; margin: 0 4px; }
    .acct { font-size: 14px; line-height: 1.8; color: #575e75; padding-top: 4px; }
    .acct .ok  { color: #3a9d4a; font-weight: bold; }
    .acct .del { color: #d9534f; font-weight: bold; }
    .acct .unk { color: #888; font-weight: bold; }
    .acct small { color: #888; }
  </style>
</head>
<body>
  <div id="pagewrapper">
    <div id="topnav">
      <div class="innerwrap">
        <div class="container">
          <a href="https://scratch.mit.edu/" class="logo">
            <img id="site-logo" alt="Scratch">
          </a>
          <ul class="site-nav">
            <li><a href="https://scratch.mit.edu/projects/editor/">Create</a></li>
            <li><a href="https://scratch.mit.edu/explore/projects/all">Explore</a></li>
            <li class="last"><a href="https://scratch.mit.edu/ideas">Ideas</a></li>
          </ul>
          <form class="search" id="profile-search-form" style="position: relative;">
            <input type="submit" class="glass" value="" style="cursor: pointer;">
            <input id="search-input" type="text" placeholder="Search username" name="q" value="kaj">
          </form>
          <ul class="account-nav">
            <li class="join-scratch"><a href="https://scratch.mit.edu/join">Join Scratch</a></li>
            <li id="login-dropdown" class="sign-in dropdown">
              <span data-toggle="dropdown" class="dropdown-toggle"><span>Sign in</span></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="container" id="content" style="margin-top: 20px;">
      <div id="alert-view"></div>

      <!-- Full "View all" page for one section -->
      <div id="full-view" style="display: none;">
        <div class="box">
          <div class="box-head" id="full-head">
            <img id="full-avatar" alt="">
            <h2 id="full-title"><a href="#" id="full-user" data-user=""></a> &raquo; <span id="full-section"></span></h2>
            <a id="full-back">&larr; Back to profile</a>
          </div>
          <div class="box-content">
            <ul class="grid full" id="full-grid"></ul>
            <div class="paging" id="paging"></div>
          </div>
        </div>
      </div>

      <div id="profile-view">
        <div class="box" id="profile-data">
          <div class="box-head">
            <form id="profile-avatar" class="portrait">
              <div class="avatar-wrapper">
                <a href="#" id="profile-avatar-link">
                  <img id="profile-avatar-img" src="https://cdn2.scratch.mit.edu/get_image/user/143585_60x60.png" width="55" height="55">
                </a>
              </div>
            </form>
            <div class="header-text">
              <h2 id="profile-username">Loading...</h2>
              <p class="profile-details">
                <span class="group">Scratcher</span>
                Joined <span id="profile-join-date" title="">Unknown</span>
                <span class="location" id="profile-country"></span>
              </p>
            </div>
          </div>
          <div class="box-content" id="profile-box">
            <div class="action-bar"></div>
            <div class="inner clearfix">
              <div class="user-content">
                <div id="user-details" class="about">
                  <h3>About me</h3>
                  <div id="bio-readonly" class="read-only">
                    <div class="viewport" style="overflow: auto; max-height: 150px;">
                      <p class="overview" id="profile-bio">Loading bio...</p>
                    </div>
                  </div>
                  <h3>What I'm working on</h3>
                  <div id="status-readonly" class="read-only">
                    <div class="viewport" style="overflow: auto; max-height: 100px;">
                      <p class="overview" id="profile-status"></p>
                    </div>
                  </div>
                </div>
                <div class="player">
                  <h3 class="featured-project-heading">Featured Project</h3>
                  <div class="stage" style="width: 282px;">
                    <a href="#" id="featured-project-link">
                      <img id="featured-project-img" src="https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png" width="282" height="210" alt="Featured project" style="background: #f2f2f2; object-fit: cover;">
                    </a>
                  </div>
                  <span class="title">
                    <a class="project-name" id="featured-project-title" href="#">Loading...</a>
                  </span>
                </div>
              </div>
              <div class="doing">
                <h3>What I've been doing</h3>
                <div id="activity-feed">
                  <div class="acct" id="account-info"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section previews (projects, favorites, studios, following, followers) are built here -->
        <div id="sections"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SCRATCH_API_BASE = 'https://api.scratch.mit.edu';

      // Paste your Cloudflare Worker URL here (no trailing slash), e.g.
      // 'https://scratch-proxy.YOURNAME.workers.dev'
      const WORKER_URL = 'https://scratch-proxy.a225tunc.workers.dev';

      const PREVIEW_LIMITS = { projects: 5, favorites: 5, studios: 4, following: 9, followers: 9 };
      const previewLimit = key => PREVIEW_LIMITS[key];  // items on the profile page
      // "View all" page sizes (same as scratch.mit.edu); the API returns at most 40 per request,
      // so bigger pages are fetched in several requests.
      const PAGE_SIZES = { user: 60, project: 24, studio: 24 };
      const pageSizeFor = key => PAGE_SIZES[SECTIONS[key].kind];

      const DEFAULT_AVATAR = 'https://cdn2.scratch.mit.edu/get_image/user/default_60x60.png';
      const DEFAULT_PROJECT = 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_144x108.png';

      // Sections shown on the profile, in order.
      const SECTIONS = {
        projects:  { fullTitle: 'Shared Projects', title: 'Shared Projects',  path: 'projects',       kind: 'project', empty: n => `${n} hasn't shared any projects` },
        favorites: { fullTitle: 'Favorites', title: 'Favorite Projects', path: 'favorites',     kind: 'project', empty: n => `${n} hasn't favorited any projects` },
        studios:   { fullTitle: 'Studios I Curate', title: 'Curated Studios',  path: 'studios/curate', kind: 'studio',  empty: n => `${n} isn't curating any studios yet` },
        following: { fullTitle: 'Following', title: 'Following',        path: 'following',      kind: 'user',    empty: n => `${n} isn't following anyone yet` },
        followers: { fullTitle: 'Followers', title: 'Followers',        path: 'followers',      kind: 'user',    empty: n => `${n} doesn't have any followers yet` },
      };

      // Fallback chain used only if the Worker/direct request fails.
      const CORS_PROXIES = [
        u => ({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, unwrap: 'allorigins' }),
        u => ({ url: `https://thingproxy.freeboard.io/fetch/${u}`, unwrap: 'raw' }),
        u => ({ url: `https://api.cors.lol/?url=${encodeURIComponent(u)}`, unwrap: 'raw' }),
        u => ({ url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, unwrap: 'raw' }),
      ];

      let currentUser = null;   // username currently displayed
      let loadToken = 0;        // ignore results from outdated loads
      let full = { key: null, page: 1 };
      let foundProjects = [];   // projects recovered through curated studios
      let useFound = false;     // true once at least one was found

      const $ = id => document.getElementById(id);

      // ---------- Username in the URL ----------
      // Pretty URLs like /screleted/kaj work through 404.html, which redirects to
      // /screleted/?user=kaj; we then rewrite the address bar back to /screleted/kaj.
      const BASE = location.pathname.replace(/index\.html$/, '').replace(/[^/]*$/, '');
      const DEFAULT_USER = $('search-input').value.trim();

      function userFromUrl() {
        const q = new URLSearchParams(location.search).get('user');
        if (q && q.trim()) return q.trim();
        if (location.pathname.startsWith(BASE)) {
          const rest = location.pathname.slice(BASE.length).split('/')[0];
          if (rest && rest !== 'index.html') {
            try { return decodeURIComponent(rest).trim(); } catch (e) { return rest.trim(); }
          }
        }
        return '';
      }

      function setUrl(username, mode) {
        if (mode === 'none') return;
        try {
          const target = BASE + encodeURIComponent(username);
          if (mode === 'replace') history.replaceState({}, '', target);
          else if (location.pathname !== target || location.search) history.pushState({}, '', target);
          document.title = username + ' – Scratch Profile Viewer';
        } catch (e) { /* e.g. opened from file:// */ }
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function fetchWithTimeout(url, ms = 10000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try { return await fetch(url, { signal: ctrl.signal }); }
        finally { clearTimeout(timer); }
      }

      function notFoundError() { const e = new Error('HTTP 404'); e.notFound = true; return e; }

      async function fetchScratchAPI(endpoint) {
        const target = SCRATCH_API_BASE + endpoint;
        const failures = [];

        // 1) Your own Worker (if set), otherwise a direct request
        try {
          const res = await fetchWithTimeout(WORKER_URL ? WORKER_URL + endpoint : target);
          if (res.status === 404) throw notFoundError();
          if (res.ok) return { data: await res.json() };
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + res.status);
        } catch (err) {
          if (err.notFound) throw err;
          failures.push((WORKER_URL ? 'worker: ' : 'direct: ') + (err.message || 'network error'));
        }

        // 2) Public proxies as a last resort
        for (const makeProxy of CORS_PROXIES) {
          const { url, unwrap } = makeProxy(target);
          try {
            const res = await fetchWithTimeout(url);
            if (!res.ok) {
              if (res.status === 404) throw notFoundError();
              failures.push(`${new URL(url).hostname}: ${res.status}`);
              continue;
            }
            const text = await res.text();
            let payload = text;
            if (unwrap === 'allorigins') {
              const wrapper = JSON.parse(text);
              const code = wrapper.status && wrapper.status.http_code;
              payload = wrapper.contents;
              if (code === 404) throw notFoundError();
              if (code && code >= 400) { failures.push(`allorigins: ${code}`); continue; }
            }
            return { data: JSON.parse(payload) };
          } catch (err) {
            if (err.notFound) throw err;
            failures.push(`${new URL(url).hostname}: ${err.message || 'network error'}`);
          }
        }

        const e = new Error('Could not reach the Scratch API (' + failures.join('; ') + ').');
        e.proxyOutage = true;
        throw e;
      }

      function formatJoinDate(joinedIso) {
        if (!joinedIso) return 'Unknown';
        const joined = new Date(joinedIso);
        const now = new Date();
        let years = now.getFullYear() - joined.getFullYear();
        let months = now.getMonth() - joined.getMonth();
        if (months < 0) { years--; months += 12; }
        const parts = [];
        if (years > 0) parts.push(years + ' year' + (years > 1 ? 's' : ''));
        if (months > 0) parts.push(months + ' month' + (months > 1 ? 's' : ''));
        return parts.length ? parts.join(', ') + ' ago' : 'just now';
      }

      // ---------- Account status ("What I've been doing") ----------
      function formatTimestamp(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return 'Unknown';
        return d.toISOString().replace('T', ' ').replace(/\.\d+Z$/, '') + ' UTC';
      }

      // Asks the Worker whether the website profile page still exists
      // (deleted accounts return 404 there even though the API keeps their data).
      async function checkAccountExists(username) {
        if (!WORKER_URL) return null;
        try {
          const r = await fetchWithTimeout(WORKER_URL + '/__exists/' + encodeURIComponent(username));
          if (!r.ok) return null;
          const j = await r.json();
          return typeof j.exists === 'boolean' ? j.exists : null;
        } catch (e) { return null; }
      }

      async function updateAccountInfo(user, token) {
        const box = $('account-info');
        const joined = user.history && user.history.joined;
        const joinedLine = `<div>Joined: <strong>${esc(joined ? formatTimestamp(joined) : 'Unknown')}</strong></div>`;
        box.innerHTML = `<div>Account: <span class="unk">Checking…</span></div>` + joinedLine;
        const exists = await checkAccountExists(user.username);
        if (token !== loadToken) return;
        let status;
        if (exists === true)       status = '<span class="ok">Exists</span>';
        else if (exists === false) status = '<span class="del">Deleted</span> <small>(profile page no longer exists)</small>';
        else                       status = '<span class="unk">Unknown</span> <small>(status check unavailable)</small>';
        box.innerHTML = `<div>Account: ${status}</div>` + joinedLine;
      }

      // ---------- Card rendering ----------
      function createCard(kind, item) {
        const li = document.createElement('li');
        if (kind === 'user') {
          const imgs = (item.profile && item.profile.images) || {};
          const src = imgs['90x90'] || imgs['60x60'] || DEFAULT_AVATAR;
          li.className = 'card user';
          li.innerHTML = `
            <a href="#" data-user="${esc(item.username)}" title="View ${esc(item.username)} in this viewer">
              <img src="${esc(src)}" alt="">
              <span class="name">${esc(item.username)}</span>
            </a>`;
        } else if (kind === 'studio') {
          const url = `https://scratch.mit.edu/studios/${item.id}/`;
          li.className = 'card studio';
          li.innerHTML = `
            <a class="thumb" href="${url}" target="_blank" rel="noopener"><img src="${esc(item.image || DEFAULT_PROJECT)}" alt=""><span class="badge"><svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><circle cx="8" cy="3.2" r="2.4"/><path d="M3.5 11c0-2.6 2-4.2 4.5-4.2s4.5 1.6 4.5 4.2z"/><circle cx="3" cy="4.4" r="1.7"/><circle cx="13" cy="4.4" r="1.7"/><path d="M0 10.6c0-1.8 1.2-3 3-3 .4 0 .7 0 1 .2-.8.7-1.3 1.7-1.4 2.8zM16 10.6c0-1.8-1.2-3-3-3-.4 0-.7 0-1 .2.8.7 1.3 1.7 1.4 2.8z"/></svg></span></a>
            <a class="name" href="${url}" target="_blank" rel="noopener" title="${esc(item.title)}">${esc(item.title)}</a>`;
        } else {
          const url = `https://scratch.mit.edu/projects/${item.id}/`;
          const author = item.author && item.author.username;
          li.className = 'card project';
          li.innerHTML = `
            <a href="${url}" target="_blank" rel="noopener"><img src="${esc(item.image || DEFAULT_PROJECT)}" alt=""></a>
            <a class="name" href="${url}" target="_blank" rel="noopener" title="${esc(item.title)}">${esc(item.title)}</a>
            ${author ? `<span class="by">by <a href="#" data-user="${esc(author)}">${esc(author)}</a></span>` : ''}`;
        }
        return li;
      }

      function fillGrid(ul, kind, items, emptyMsg) {
        ul.innerHTML = '';
        if (!items.length) {
          const li = document.createElement('li');
          li.className = emptyMsg && emptyMsg.startsWith('No more') ? 'msg' : 'empty';
          li.textContent = emptyMsg || 'Nothing here.';
          ul.appendChild(li);
          return;
        }
        items.forEach(it => ul.appendChild(createCard(kind, it)));
      }

      function errorText(err) {
        return err.notFound ? 'Not available for this account.' : 'Could not load: ' + err.message;
      }

      function sectionEndpoint(username, key, limit, offset) {
        return '/users/' + encodeURIComponent(username) + '/' + SECTIONS[key].path +
               '?limit=' + limit + '&offset=' + offset;
      }

      // ---------- Profile page sections ----------
      function buildSectionBoxes() {
        const wrap = $('sections');
        wrap.innerHTML = '';
        Object.keys(SECTIONS).forEach(key => {
          const box = document.createElement('div');
          box.className = 'box slider-carousel-container prevent-select';
          box.style.marginTop = '20px';
          box.id = 'section-' + key;
          if (key === 'studios') box.style.display = 'none';   // only shown when the user has studios
          box.innerHTML = `
            <div class="box-head">
              <h4>${esc(SECTIONS[key].title)}</h4>
              <a href="#" data-view-all="${key}" style="display: none;">View all</a>
            </div>
            <div class="box-content" style="min-height: 60px;">
              <div class="note" style="display: none;"></div>
              <ul class="grid preview k-${SECTIONS[key].kind}"><li class="msg">Loading…</li></ul>
            </div>`;
          wrap.appendChild(box);
        });
      }

      async function loadSectionPreview(username, key, token) {
        const box = $('section-' + key);
        const ul = box.querySelector('.grid');
        try {
          const { data } = await fetchScratchAPI(sectionEndpoint(username, key, previewLimit(key), 0));
          if (token !== loadToken) return null;
          const items = Array.isArray(data) ? data : [];
          fillGrid(ul, SECTIONS[key].kind, items, SECTIONS[key].empty(username));
          box.querySelector('[data-view-all]').style.display = items.length ? '' : 'none';
          if (key === 'studios' && items.length) box.style.display = '';
          return items;
        } catch (err) {
          if (token !== loadToken) return null;
          if (key === 'studios' && err.notFound) return null;   // stays hidden
          box.style.display = '';
          ul.innerHTML = '';
          const li = document.createElement('li');
          li.className = 'msg';
          li.textContent = errorText(err);
          ul.appendChild(li);
          return null;
        }
      }

      function setFeatured(project) {
        document.querySelector('.player').style.display = project ? '' : 'none';
        if (!project) return;
        const img = $('featured-project-img');
        const title = $('featured-project-title');
        const link = $('featured-project-link');
        if (project) {
          img.src = project.image || DEFAULT_PROJECT;
          title.textContent = project.title;
          title.href = link.href = `https://scratch.mit.edu/projects/${project.id}/`;
        } else {
          img.src = 'https://cdn2.scratch.mit.edu/get_image/project/1147906174_282x210.png';
          title.textContent = 'No projects yet';
          title.href = link.href = '#';
        }
      }

      async function loadProfile(username, urlMode = 'push') {
        if (!username) return;
        setUrl(username, urlMode);
        const token = ++loadToken;
        foundProjects = [];
        useFound = false;
        hideFull();

        const alertBox = $('alert-view');
        alertBox.innerHTML = '<div style="padding: 10px; background: #e3f2fd; margin-bottom: 10px;">Loading profile for <strong>' + esc(username) + '</strong>...</div>';

        try {
          const { data: user } = await fetchScratchAPI('/users/' + encodeURIComponent(username));
          if (token !== loadToken) return;
          if (!user || typeof user !== 'object' || !user.username) {
            throw new Error(`User “${username}” not found`);
          }

          alertBox.innerHTML = '';
          currentUser = user.username;
          $('search-input').value = user.username;

          $('profile-username').textContent = user.username;
          const profile = user.profile || {};

          $('profile-avatar-img').src =
            (profile.images && (profile.images['60x60'] || profile.images['90x90'])) || DEFAULT_AVATAR;
          $('profile-avatar-link').href = `https://scratch.mit.edu/users/${encodeURIComponent(user.username)}/`;

          const joinedIso = user.history && user.history.joined;
          $('profile-join-date').textContent = formatJoinDate(joinedIso);
          $('profile-join-date').title = joinedIso ? joinedIso.split('T')[0] : '';
          $('profile-country').textContent = profile.country || '';

          // bio/status are plain text on Scratch: use textContent (no HTML injection)
          $('profile-bio').textContent = profile.bio || '';
          $('profile-status').textContent = profile.status || '';

          updateAccountInfo(user, token);   // background: deleted / exists check
          setFeatured(null);
          buildSectionBoxes();

          const results = await Promise.all(
            Object.keys(SECTIONS).map(k => loadSectionPreview(user.username, k, token)));
          if (token !== loadToken) return;
          const projects = results[0];
          setFeatured(projects && projects.length ? projects[0] : null);

          const studioItems = results[Object.keys(SECTIONS).indexOf('studios')];
          if ((!projects || !projects.length) && studioItems && studioItems.length) {
            findProjectsViaStudios(user, token);   // runs in the background
          }

        } catch (err) {
          if (token !== loadToken) return;
          const msg = err.notFound ? `Error: User “${esc(username)}” not found` : `Error: ${esc(err.message)}`;
          alertBox.innerHTML = `<div class="error-message">${msg}</div>`;
          console.error('Profile load error:', err);
        }
      }


      // ---------- Recover projects through curated studios ----------
      // For accounts with curated studios but no listed projects: look inside each
      // curated studio for projects whose creator is this user.
      const STUDIO_SCAN_MAX_STUDIOS = 40;   // curated studios to check (one API page)
      const STUDIO_SCAN_MAX_PAGES = 3;      // pages of 40 projects checked per studio
      const STUDIO_SCAN_CONCURRENCY = 4;

      async function runPool(list, size, worker) {
        let next = 0;
        await Promise.all(Array.from({ length: Math.min(size, list.length) }, async () => {
          while (next < list.length) { const i = next++; await worker(list[i], i); }
        }));
      }

      async function findProjectsViaStudios(user, token) {
        const box = $('section-projects');
        const ul = box.querySelector('.grid');
        const note = box.querySelector('.note');
        const viewAll = box.querySelector('[data-view-all]');
        const setNote = t => { note.style.display = t ? '' : 'none'; note.textContent = t || ''; };

        setNote('Checking curated studios for projects by this user…');
        let studios;
        try {
          const r = await fetchScratchAPI(sectionEndpoint(user.username, 'studios', STUDIO_SCAN_MAX_STUDIOS, 0));
          studios = Array.isArray(r.data) ? r.data : [];
        } catch (err) { if (token === loadToken) setNote(''); return; }
        if (token !== loadToken || !studios.length) { if (token === loadToken) setNote(''); return; }

        const uname = user.username.toLowerCase();
        const found = new Map();
        let done = 0;

        const render = () => {
          foundProjects = [...found.values()];
          useFound = foundProjects.length > 0;
          if (!useFound) return;
          fillGrid(ul, 'project', foundProjects.slice(0, previewLimit('projects')));
          viewAll.style.display = '';
        };

        await runPool(studios, STUDIO_SCAN_CONCURRENCY, async st => {
          for (let page = 0; page < STUDIO_SCAN_MAX_PAGES; page++) {
            if (token !== loadToken) return;
            let data;
            try {
              const r = await fetchScratchAPI(`/studios/${st.id}/projects?limit=40&offset=${page * 40}`);
              data = Array.isArray(r.data) ? r.data : [];
            } catch (err) { break; }
            let added = false;
            for (const p of data) {
              const mine = String(p.creator_id) === String(user.id) ||
                           String(p.username || '').toLowerCase() === uname;
              if (mine && !found.has(p.id)) {
                found.set(p.id, { id: p.id, title: p.title, image: p.image, author: { username: p.username || user.username } });
                added = true;
              }
            }
            if (added && token === loadToken) {
              const first = !useFound;
              render();
              if (first) setFeatured(foundProjects[0]);
            }
            if (data.length < 40) break;
          }
          done++;
          if (token === loadToken) setNote(`Checking curated studios for projects by this user… (${done}/${studios.length}, ${found.size} found)`);
        });

        if (token !== loadToken) return;
        setNote(found.size
          ? `${found.size} project${found.size > 1 ? 's' : ''} found by searching the ${studios.length} studio${studios.length > 1 ? 's' : ''} this user curates (up to ${STUDIO_SCAN_MAX_PAGES * 40} projects per studio checked). Scratch doesn't list these on the profile itself.`
          : `Checked ${studios.length} curated studio${studios.length > 1 ? 's' : ''}: none of this user's projects were found.`);
      }

      // ---------- "View all" pages ----------
      function hideFull() {
        $('full-view').style.display = 'none';
        $('profile-view').style.display = '';
        full = { key: null, page: 1 };
      }

      // Totals: the API has no count endpoint, so they are learned from a short last page
      // or, failing that, found with a handful of limit=1 probes (exponential + binary search).
      const countCache = new Map();
      const countKey = (user, key) => user.toLowerCase() + '|' + key;
      function getCount(key) {
        if (key === 'projects' && useFound) return foundProjects.length;
        const c = countCache.get(countKey(currentUser, key));
        return c == null ? null : c;
      }

      async function fetchRange(username, key, start, count) {
        const reqs = [];
        for (let off = start; off < start + count; off += 40) {
          reqs.push(fetchScratchAPI(sectionEndpoint(username, key, Math.min(40, start + count - off), off)));
        }
        const res = await Promise.all(reqs);
        return res.reduce((all, r) => all.concat(Array.isArray(r.data) ? r.data : []), []);
      }

      async function countItems(username, key) {
        const has = async off => {
          const { data } = await fetchScratchAPI(sectionEndpoint(username, key, 1, off));
          return Array.isArray(data) && data.length > 0;
        };
        if (!(await has(0))) return 0;
        let lo = 0, hi = 1;
        while (hi < 1000000 && await has(hi)) { lo = hi; hi *= 2; }
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (await has(mid)) lo = mid; else hi = mid;
        }
        return lo + 1;
      }

      // "« previous 1 2 3 4 5 next »"
      function renderPaging(page, total, hasNext) {
        const box = $('paging');
        const out = [];
        out.push(page > 1 ? `<a data-page="${page - 1}">&laquo; previous</a>` : '<span class="dis">&laquo; previous</span>');
        if (total) {
          const set = new Set([1, total]);
          for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= total) set.add(i);
          let prev = 0;
          [...set].sort((x, y) => x - y).forEach(n => {
            if (n - prev > 1) out.push('<span class="dis">…</span>');
            out.push(n === page ? `<span class="cur">${n}</span>` : `<a data-page="${n}">${n}</a>`);
            prev = n;
          });
        } else {
          out.push(`<span class="cur">${page}</span>`);
        }
        out.push(hasNext ? `<a data-page="${page + 1}">next &raquo;</a>` : '<span class="dis">next &raquo;</span>');
        box.innerHTML = out.join(' ');
      }

      async function showFull(key, page) {
        if (!currentUser) return;
        full = { key, page };
        const sec = SECTIONS[key];
        const size = pageSizeFor(key);
        const myKey = key, myPage = page, myUser = currentUser;
        const stale = () => full.key !== myKey || full.page !== myPage || currentUser !== myUser;

        $('profile-view').style.display = 'none';
        $('full-view').style.display = '';
        $('full-avatar').src = $('profile-avatar-img').src;
        const userLink = $('full-user');
        userLink.textContent = myUser;
        userLink.dataset.user = myUser;

        const refreshHead = hasNext => {
          const c = getCount(key);
          $('full-section').textContent = sec.fullTitle + (c != null ? ` (${c})` : '');
          renderPaging(page, c != null ? Math.max(1, Math.ceil(c / size)) : null, hasNext);
        };

        const ul = $('full-grid');
        ul.className = 'grid full k-' + sec.kind;
        ul.innerHTML = '<li class="msg">Loading…</li>';
        refreshHead(false);
        window.scrollTo(0, 0);

        let items;
        try {
          items = (key === 'projects' && useFound)
            ? foundProjects.slice((page - 1) * size, page * size)
            : await fetchRange(myUser, key, (page - 1) * size, size);
        } catch (err) {
          if (stale()) return;
          ul.innerHTML = '';
          const li = document.createElement('li');
          li.className = 'msg';
          li.textContent = errorText(err);
          ul.appendChild(li);
          return;
        }
        if (stale()) return;

        fillGrid(ul, sec.kind, items, page > 1 ? 'No more results.' : sec.empty(myUser));

        // A short page reveals the exact total for free
        if (!(key === 'projects' && useFound) && items.length < size && items.length > 0) {
          countCache.set(countKey(myUser, key), (page - 1) * size + items.length);
        } else if (!(key === 'projects' && useFound) && page === 1 && items.length === 0) {
          countCache.set(countKey(myUser, key), 0);
        }
        refreshHead(items.length >= size);

        // Otherwise find the total in the background and update the title / page numbers
        if (getCount(key) == null) {
          try {
            const total = await countItems(myUser, key);
            countCache.set(countKey(myUser, key), total);
            if (!stale()) refreshHead(page * size < total);
          } catch (e) { /* leave the count out */ }
        }
      }

      // ---------- Header logo (tries several URLs, falls back to text) ----------
      (function() {
        const img = $('site-logo');
        const candidates = [
          'https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/images/logo_sm.png',
          'https://cdn.scratch.mit.edu/scratchr2/static/__0b77027edd8c5758537a8bc19a9ae817__/images/logo.png',
          'https://scratch.mit.edu/images/logo_sm.png',
        ];
        let i = 0;
        function next() {
          if (i < candidates.length) { img.src = candidates[i++]; return; }
          const span = document.createElement('span');
          span.className = 'logo-fallback';
          span.textContent = 'SCRATCH';
          img.replaceWith(span);
        }
        img.onerror = next;
        next();
      })();

      // Size the logo to the actual header bar so it always sits fully inside it
      function fitLogo() {
        const bar = $('topnav');
        const logo = bar.querySelector('.logo');
        const img = $('site-logo');
        const h = bar.offsetHeight > 20 ? bar.offsetHeight : 35;
        logo.style.height = h + 'px';
        if (img) img.style.height = Math.round(h * 0.68) + 'px';
      }
      fitLogo();
      window.addEventListener('load', fitLogo);
      window.addEventListener('resize', fitLogo);
      $('site-logo') && $('site-logo').addEventListener('load', fitLogo);

      // ---------- Events ----------
      document.addEventListener('click', function(e) {
        const viewAll = e.target.closest('[data-view-all]');
        if (viewAll) { e.preventDefault(); showFull(viewAll.dataset.viewAll, 1); return; }

        const pg = e.target.closest('[data-page]');
        if (pg) { e.preventDefault(); showFull(full.key, parseInt(pg.dataset.page, 10)); return; }

        const userLink = e.target.closest('[data-user]');
        if (userLink && userLink.dataset.user) { e.preventDefault(); loadProfile(userLink.dataset.user); window.scrollTo(0, 0); }
      });
      $('full-back').addEventListener('click', hideFull);

      $('search-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const username = this.value.trim();
          if (username) loadProfile(username);
        }
      });

      $('profile-search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = $('search-input').value.trim();
        if (username) loadProfile(username);
      });

      window.addEventListener('load', () => {
        const fromUrl = userFromUrl();
        const initial = fromUrl || DEFAULT_USER;
        if (initial) { $('search-input').value = initial; loadProfile(initial, fromUrl ? 'replace' : 'none'); }
      });

      window.addEventListener('popstate', () => {
        const u = userFromUrl() || DEFAULT_USER;
        if (u) { $('search-input').value = u; loadProfile(u, 'none'); }
      });
    })();
  </script>
</body>
</html>
